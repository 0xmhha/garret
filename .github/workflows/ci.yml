name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to commit SHAs (docs/design/security.md,
# Dependencies). Dependabot proposes updates after a 7-day cooldown.

jobs:
  macos:
    # Required: macOS is the supported server platform. Branch protection on
    # main lists this job as a required check.
    name: macos
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Build
        # Installs, tests and builds the web interface, then compiles with it.
        run: make build
      - name: Web dependencies audit
        run: make web-audit
      - name: Test
        run: make test
      - name: Build without Node still works
        run: make build-go
      - name: Browsers for the end-to-end suite
        # Chrome comes with the runner; WebKit is Playwright's build.
        run: cd web && npx playwright install webkit
      - name: End to end
        run: make e2e
      - name: Keychain installation
        # Runs the real security commands against a temporary keychain;
        # skipped elsewhere so go test never creates a keychain on a
        # developer's machine.
        env:
          GARRET_KEYCHAIN_TEST: "1"
        run: go test -count=1 -run TestKeychainStepsOnMacOS -v ./internal/enroll/
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: Vulnerabilities
        run: make vuln
      - name: Generated code is current
        run: make generate-check

  linux:
    # Not release-blocking (docs/design/decisions.md, D13): failures are
    # reported but do not fail the workflow.
    name: linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Build
        run: make build
      - name: Test
        run: make test
      - name: Browsers for the end-to-end suite
        run: cd web && npx playwright install --with-deps webkit
      - name: End to end
        run: make e2e
