version: "2"

run:
  timeout: 5m

linters:
  # The standard set (errcheck, govet, ineffassign, staticcheck, unused) plus
  # security and style checks required by CONTRIBUTING.md.
  default: standard
  enable:
    - gosec
    - revive
    - misspell
    - errorlint
    - bodyclose
    - contextcheck
    - noctx
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: error-strings
        - name: error-naming
        - name: receiver-naming
        - name: var-naming
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/0xmhha/garret
